# ============================================================
# Guía 2 - E40: compresión transparente (gzip)
# Se incluye desde los server{} de foo y bar con:
#     include snippets/protos-gzip.conf;
# ------------------------------------------------------------
# "Transparente": el cliente manda  Accept-Encoding: gzip
#                 nginx responde    Content-Encoding: gzip
# El recurso en disco NO cambia, se comprime al vuelo.
# ============================================================

gzip on;                 # (nginx.conf ya lo tiene en http{}, acá lo dejamos explícito)
gzip_vary on;            # agrega "Vary: Accept-Encoding" -> los caches guardan versión comprimida y sin comprimir por separado
gzip_proxied any;        # comprimir también las respuestas que vienen de un backend (proxy reverso, E39)
gzip_comp_level 5;       # 1 = rápido/poco, 9 = lento/mucho. 5 es un buen equilibrio CPU vs tamaño
gzip_min_length 256;     # no comprimir respuestas de menos de 256 bytes (no vale la pena)

# text/html se comprime SIEMPRE que gzip esté on; acá van los otros tipos.
# OJO: no tiene sentido comprimir jpg/png/zip (ya están comprimidos).
gzip_types text/plain text/css text/xml application/json application/javascript
           application/xml image/svg+xml;
