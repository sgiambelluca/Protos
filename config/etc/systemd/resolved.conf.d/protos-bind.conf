# ============================================================
# Guía 3 - E53: que esta máquina use NUESTRO bind (127.0.0.1) como DNS primario
#
# En Ubuntu /etc/resolv.conf apunta a 127.0.0.53 (systemd-resolved, un
# resolver "stub" local). No se edita resolv.conf a mano: se le dice a
# systemd-resolved a qué servidor reenviar.
#
#   DNS=127.0.0.1   -> servidor DNS global = named de esta VM
#   Domains=~.      -> "~." = usar este servidor para TODOS los dominios
#
# Verificar:   resolvectl status     (Global: DNS Servers 127.0.0.1)
#              resolvectl query foo.pdc.lab
# Deshacer:    sudo rm /etc/systemd/resolved.conf.d/protos-bind.conf
#              sudo systemctl restart systemd-resolved
# ============================================================
[Resolve]
DNS=127.0.0.1
Domains=~.
