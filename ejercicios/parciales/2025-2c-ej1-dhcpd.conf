# ============================================================
# Parcial 2025 2C - Ej I: servidor DHCP para la red 192.168.100.0/24
# Va en /etc/dhcp/dhcpd.conf  (y la interfaz en /etc/default/isc-dhcp-server)
# Validar:  sudo dhcpd -t -cf /etc/dhcp/dhcpd.conf
# ============================================================
ddns-update-style none;          # sugerencia de la guía: sin DNS dinámico
authoritative;                   # es EL servidor de esta red (contesta NAK a pedidos de IPs inválidas)
default-lease-time 600;          # 10 minutos
max-lease-time 7200;

subnet 192.168.100.0 netmask 255.255.255.0 {
    range 192.168.100.10 192.168.100.200;              # req. 3: rango 10-200 (el resto reservado)
    option routers 192.168.100.1;                       # gateway (la IP del server en esta red)
    option subnet-mask 255.255.255.0;
    option broadcast-address 192.168.100.255;
    option domain-name-servers 8.8.8.8, 8.8.4.4;        # req. 2: DNS de Google (separados por COMA)
}

# req. 1: la impresora SIEMPRE con la misma IP -> reserva por MAC.
# La IP fija va FUERA del range (si no, se la podría dar a otro cliente).
host impresora {
    hardware ethernet 08:00:27:AE:C8:6A;
    fixed-address 192.168.100.8;
}
