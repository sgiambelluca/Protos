# ============================================================
# Simulacro - Ej 4: servidor DHCP para la oficina 192.168.90.0/24
# Va en /etc/dhcp/dhcpd.conf  (y la interfaz en /etc/default/isc-dhcp-server: INTERFACESv4="enpXsY")
# Validar:   sudo dhcpd -t -cf /etc/dhcp/dhcpd.conf
# Practicar: ~/Protos/scripts/practicar-dhcp.sh ~/Protos/ejercicios/simulacro/ej4-dhcpd.conf
# ============================================================
ddns-update-style none;          # sin DNS dinámico
authoritative;                   # es EL servidor de esta red (contesta NAK a pedidos de IPs inválidas)
default-lease-time 600;          # 10 minutos
max-lease-time 7200;

subnet 192.168.90.0 netmask 255.255.255.0 {
    range 192.168.90.20 192.168.90.150;                 # req. 3: de la .20 a la .150 (el resto queda reservado)
    option routers 192.168.90.1;                        # gateway = la IP del server en esta red
    option subnet-mask 255.255.255.0;
    option broadcast-address 192.168.90.255;
    option domain-name-servers 1.1.1.1, 1.0.0.1;        # req. 2: DNS de Cloudflare (separados por COMA)
}

# req. 1: la impresora SIEMPRE con la misma IP -> reserva por MAC.
# La IP fija va FUERA del range (si no, se la podría dar a otro cliente).
host impresora {
    hardware ethernet 08:00:27:1A:2B:3C;
    fixed-address 192.168.90.8;
}
